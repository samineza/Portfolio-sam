<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Project | SHEMA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}" />
  </head>
  <body class="admin-body">
    <div class="admin-layout">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="brand-mark">S</div>
          <span>SHEMA</span>
        </div>
        <nav class="sidebar-nav">
          <a class="nav-item" href="{{ url_for('admin.dashboard') }}">Dashboard</a>
          <a class="nav-item active" href="{{ url_for('admin.projects') }}">Portfolio Projects</a>
          <a class="nav-item" href="{{ url_for('admin.upload_page') }}">Upload Project</a>
          <a class="nav-item" href="{{ url_for('admin.settings_page') }}">Settings</a>
          <a class="nav-item danger" href="{{ url_for('auth.logout') }}">Logout</a>
        </nav>
      </aside>

      <main class="content-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow">Edit Project</p>
            <h1>{{ project.title }}</h1>
          </div>
        </header>

        <form class="project-form" method="post" action="/admin/api/projects/{{ project.id }}" data-edit-form="true">
          <div class="form-grid">
            <div class="panel form-panel">
              <h2>Project Details</h2>
              <div class="field-group">
                <label>Project Title</label>
                <input type="text" name="title" value="{{ project.title }}" required />
              </div>
              <div class="field-group">
                <label>Project Category</label>
                <select name="category">
                  {% for category in categories %}
                  <option value="{{ category.name }}" {% if project.category == category.name %}selected{% endif %}>{{ category.name }}</option>
                  {% endfor %}
                </select>
              </div>
              <div class="field-group">
                <label>Project Description</label>
                <textarea name="description" rows="5">{{ project.description or '' }}</textarea>
              </div>
              <div class="field-group">
                <label>Client Name</label>
                <input type="text" name="client_name" value="{{ project.client_name or '' }}" />
              </div>
              <div class="field-group">
                <label>Project Date</label>
                <input type="date" name="project_date" value="{{ project.project_date or '' }}" />
              </div>
              <div class="field-group">
                <label>Project URL</label>
                <input type="url" name="project_url" value="{{ project.project_url or '' }}" />
              </div>
              <div class="field-group">
                <label>Project Status</label>
                <select name="status">
                  <option value="Draft" {% if project.status == 'Draft' %}selected{% endif %}>Draft</option>
                  <option value="Published" {% if project.status == 'Published' %}selected{% endif %}>Published</option>
                  <option value="Hidden" {% if project.status == 'Hidden' %}selected{% endif %}>Hidden</option>
                </select>
              </div>
            </div>

            <div class="panel form-panel">
              <h2>Media & Links</h2>
              <div class="field-group">
                <label>Video URL</label>
                <input type="url" name="video_url" value="{{ project.video_url or '' }}" />
              </div>
              <div class="field-group">
                <label>YouTube URL</label>
                <input type="url" name="youtube_url" value="{{ project.youtube_url or '' }}" />
              </div>
              <div class="field-group">
                <label>Vimeo URL</label>
                <input type="url" name="vimeo_url" value="{{ project.vimeo_url or '' }}" />
              </div>
              <div class="field-group">
                <label>Current Cover</label>
                {% if project.cover_image %}
                <img src="/{{ project.cover_image.replace('\\', '/') }}" class="cover-preview" alt="Cover" />
                {% else %}
                <p>No cover image selected.</p>
                {% endif %}
              </div>
            </div>
          </div>

          <div class="form-actions">
            <button class="btn btn-primary" type="submit">Update Project</button>
          </div>
        </form>
      </main>
    </div>
    <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
  </body>
</html>
