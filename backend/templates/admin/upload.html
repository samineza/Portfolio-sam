<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload Project | SHEMA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}" />
  </head>
  <body class="admin-body">
    <div class="admin-layout">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="brand-mark">S</div>
          <span>SHEMA</span>
        </div>
        <nav class="sidebar-nav">
          <a class="nav-item" href="{{ url_for('admin.dashboard') }}">Dashboard</a>
          <a class="nav-item" href="{{ url_for('admin.projects') }}">Portfolio Projects</a>
          <a class="nav-item active" href="{{ url_for('admin.upload_page') }}">Upload Project</a>
          <a class="nav-item" href="{{ url_for('admin.settings_page') }}">Settings</a>
          <a class="nav-item danger" href="{{ url_for('auth.logout') }}">Logout</a>
        </nav>
      </aside>

      <main class="content-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow">Portfolio Manager</p>
            <h1>Upload New Project</h1>
          </div>
        </header>

        <form id="projectForm" class="project-form" method="post" enctype="multipart/form-data">
          <div class="form-grid">
            <div class="panel form-panel">
              <h2>Basic Information</h2>
              <div class="field-group">
                <label>Project Title</label>
                <input type="text" name="title" required />
              </div>
              <div class="field-group">
                <label>Project Category</label>
                <select name="category">
                  {% for category in categories %}
                  <option value="{{ category.name }}">{{ category.name }}</option>
                  {% endfor %}
                </select>
              </div>
              <div class="field-group">
                <label>Project Description</label>
                <textarea name="description" rows="5"></textarea>
              </div>
              <div class="field-group">
                <label>Client Name</label>
                <input type="text" name="client_name" />
              </div>
              <div class="field-group">
                <label>Project Date</label>
                <input type="date" name="project_date" />
              </div>
              <div class="field-group">
                <label>Project URL</label>
                <input type="url" name="project_url" placeholder="https://" />
              </div>
              <div class="field-group">
                <label>Project Status</label>
                <select name="status">
                  <option value="Draft">Draft</option>
                  <option value="Published">Published</option>
                  <option value="Hidden">Hidden</option>
                </select>
              </div>
            </div>

            <div class="panel form-panel">
              <h2>Media</h2>
              <div class="field-group">
                <label>Project Images</label>
                <input type="file" name="images" id="imageUpload" accept="image/jpeg,image/png,image/webp" multiple />
              </div>
              <div class="field-group">
                <label>Video URL</label>
                <input type="url" name="video_url" placeholder="https://video-link.com" />
              </div>
              <div class="field-group">
                <label>YouTube URL</label>
                <input type="url" name="youtube_url" placeholder="https://youtube.com/watch?..." />
              </div>
              <div class="field-group">
                <label>Vimeo URL</label>
                <input type="url" name="vimeo_url" placeholder="https://vimeo.com/..." />
              </div>
              <div class="preview-box">
                <div class="preview-header">
                  <h3>Image Preview</h3>
                </div>
                <div id="previewGrid" class="preview-grid"></div>
              </div>
            </div>
          </div>

          <div class="form-actions">
            <button class="btn btn-primary" type="submit">Save Project</button>
          </div>
        </form>
      </main>
    </div>
    <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
  </body>
</html>
